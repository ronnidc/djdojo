# djdojo.conf - yt-dlp's configuration for djdojo. It sits next to the script, which passes it with
# --config-locations after --ignore-config, so a user's own yt-dlp config never interferes.
# Only what AIFF and FLAC share. The format choice and the folder are added by the script.

# For DJ decks: the audio is decoded once from YouTube's best stream and stored lossless, so no
# MP3 re-encoding is stacked on top.

# Source: the best audio stream by yt-dlp's own ranking. Without login that is Opus 251 (about
# 140k, up to 20 kHz) rather than AAC 140 (128k, cut at 16 kHz). With Premium cookies YouTube's
# 256k stream ranks higher and is picked by itself.
--format "ba/b"

# Output: the whole playlist in one folder. The folder (--paths) is set by the script.
#   Playlist name/001 - Title.aiff
# "/" has to be literal in the template: a "/" produced inside a field is sanitized away.
# No --restrict-filenames: it strips non-ASCII letters, spaces and the " - " separator.
--output "%(album_dir,playlist_title,artists.0,artist,channel,uploader|Unknown artist)s/%(playlist_index&{:03d} - |)s%(title)s.%(ext)s"
--no-overwrites
# The USB stick for the decks is FAT32, which does not take ? " * : < > | in file names.
# They are replaced with look-alike Unicode characters, all other letters are kept.
--windows-filenames

--embed-metadata

# Cover: YouTube thumbnails are 16:9, so the middle is cropped to a square to work as album art.
# The crop runs only when the thumbnail is converted webp -> jpg, which is the normal case.
# The playlist's own image is skipped. Whether yt-dlp embeds the cover (FLAC) or the script does
# it afterwards (AIFF) is decided by the script.
--convert-thumbnails jpg
--ppa "ThumbnailsConvertor+ffmpeg_o:-c:v mjpeg -vf crop=\"'if(gt(ih,iw),iw,ih)':'if(gt(iw,ih),ih,iw)'\""
--output "pl_thumbnail:"

# Folder name for albums (album_dir): YouTube Music's album playlists are called "Album - Title"
# (or "Single - ", "EP - "). The prefix is dropped, other playlist names are kept. A group that
# does not match leaves the field unset, so the fallbacks in the templates above still work.
--parse-metadata "%(playlist_title|)s:(?:^(?:Album|Single|EP) - (?P<album_dir>.+)$)?"

# Tags yt-dlp does not set by itself. An empty field does not match, so the tag is left out.
# Track number "3/12" from the position in the playlist
--parse-metadata "%(playlist_index|)s%(playlist_count,n_entries&/{}|)s:(?P<meta_track>[0-9]+(?:/[0-9]+)?)?"
# Album = YouTube Music's own album field if there is one, otherwise the playlist's folder name
--parse-metadata "%(album,album_dir,playlist_title|)s:(?P<meta_album>.+)?"
# Album artist = YouTube Music's first artist, otherwise the channel, so the folder groups as one album
--parse-metadata "%(artists.0,artist,channel,uploader|)s:(?P<meta_album_artist>.+)?"
# Year = release date (YouTube Music tracks have one), otherwise the upload date
--parse-metadata "%(release_date,release_year,upload_date|)s:(?P<meta_date>.+)?"
# Drop the noise: the whole YouTube description (it lands in two tags) and "genre", which would
# be the YouTube category, for example "People & Blogs"
--parse-metadata ":(?P<meta_description>)"
--parse-metadata ":(?P<meta_synopsis>)"
--parse-metadata ":(?P<meta_genre>)"

# Playlists: do not stop at one failure. No download archive: --no-overwrites skips files that
# are already in the folder, so a rerun only downloads what is missing.
--ignore-errors
--yes-playlist

# Quiet output
--no-mtime
--progress
